<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मौजुदा सूची दर्ता फारम - Suchi Darta Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .form-input {
      width: 100%;
      border-radius: 0.5rem;
      border: 1px solid #e6eef6;
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      color: #0f172a;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15,23,42,0.03);
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .form-input::placeholder { color: #94a3b8; }
    .form-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 6px rgba(59,130,246,0.06); }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">

  <!-- Decorative background blobs and premium gradient (fixed full-viewport to avoid clipping) -->
  <div id="premium-bg" aria-hidden="true" style="position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;">
    <div style="position:absolute;left:-5rem;top:-10rem;width:24rem;height:24rem;border-radius:9999px;background: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.35), rgba(99,102,241,0.10) 40%, transparent 60%); filter: blur(60px); opacity:0.95; transform:translateZ(0);"></div>
    <div style="position:absolute;right:-8rem;bottom:-12rem;width:28rem;height:28rem;border-radius:9999px;background: radial-gradient(circle at 70% 70%, rgba(250,204,21,0.22), rgba(239,68,68,0.08) 40%, transparent 60%); filter: blur(80px); opacity:0.9; transform:translateZ(0);"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(6,11,23,0.18) 0%, rgba(15,23,42,0.18) 100%);mix-blend-mode:overlay;"></div>
  </div>

  <div id="appCard" class="w-full max-w-2xl rounded-2xl p-6 sm:p-8" style="background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.78)); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(2,6,23,0.45); backdrop-filter: blur(8px) saturate(120%);">
    <div class="mb-8 border-b border-slate-100 pb-6">
      <div class="text-center">
        <h1 class="text-3xl font-extrabold tracking-wider text-indigo-700 mb-1">आरविवि मर्चेन्ट बैंकिङ्ग लि.</h1>
        <h2 class="text-2xl font-extrabold tracking-tight text-slate-900">मौजुदा सूची दर्ता फारम</h2>
        <p class="text-sm text-slate-500 mt-1">Suchi Darta Registration — कृपया आवश्यक कागजातहरू अपलोड गर्नुहोस्</p>
      </div>
    </div>

    <form id="suchiDartaForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
      
      <div class="space-y-4">
        <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider">१. विवरणहरू (Company Profile)</h4>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="companyName" class="block text-sm font-medium text-slate-700 mb-1">फर्म / कम्पनीको नाम (Company Name) <span class="text-red-500">*</span></label>
            <input type="text" id="companyName" required 
              class="form-input" placeholder="e.g. ABC Traders">
          </div>
          <div>
            <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">प्रोप्राइटर / सम्पर्क व्यक्तिको नाम (Full Name) <span class="text-red-500">*</span></label>
            <input type="text" id="fullName" required 
              class="form-input" placeholder="Authorized Representative Name">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="panNumber" class="block text-sm font-medium text-slate-700 mb-1">स्थायी लेखा नम्बर / प्यान (PAN No.) <span class="text-red-500">*</span></label>
            <input type="text" id="panNumber" pattern="\d{9}" required maxlength="9"
              class="form-input" placeholder="9-digit PAN Number">
          </div>
          <div>
            <label for="contactNumber" class="block text-sm font-medium text-slate-700 mb-1">सम्पर्क फोन नम्बर (Contact Number) <span class="text-red-500">*</span></label>
            <input type="tel" id="contactNumber" required 
              class="form-input" placeholder="Mobile or Landline No.">
          </div>
        </div>

        <div>
          <label for="address" class="block text-sm font-medium text-slate-700 mb-1">कम्पनीको ठेगाना (Company Address) <span class="text-red-500">*</span></label>
          <input type="text" id="address" required 
            class="form-input" placeholder="e.g. Ward No, Municipality, District">
        </div>

        <div>
          <label for="companySales" class="block text-sm font-medium text-slate-700 mb-1">आपूर्ति वा सेवाको विधा (Nature of Goods / Services Sold) <span class="text-red-500">*</span></label>
          <textarea id="companySales" rows="2" required 
            class="form-input" placeholder="Describe what items or services your business supplies..."></textarea>
        </div>
      </div>

      <hr class="border-slate-100">

      <div class="space-y-4">
        <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider">२. आवश्यक कागजातहरू (Required Documents)</h4>

        <p class="text-xs text-slate-400">Drag & drop files or click to choose. Max recommended file size: <strong>10 MB</strong></p>

        <div class="grid grid-cols-1 gap-4">
          <!-- Reusable upload block: PAN -->
          <div class="upload-block p-3 bg-slate-50 rounded-xl border border-slate-200" id="pan-block">
            <label class="block text-sm font-semibold text-slate-700 mb-2">प्यान दर्ता प्रमाणपत्र (PAN Registration Certificate) <span class="text-red-500">*</span></label>
            <div class="dropzone flex items-center justify-between gap-4 p-3 rounded-lg border-2 border-dashed border-slate-200 bg-white hover:border-blue-300 transition-all" data-input="docPan" data-info="pan-info">
              <div class="flex items-center gap-3">
                <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16V4a1 1 0 011-1h8a1 1 0 011 1v12M7 12h10M9 20h6"></path></svg>
                <div>
                  <div class="text-sm text-slate-600" id="pan-info">No file selected</div>
                  <div class="text-xs text-slate-400 mt-0.5" id="pan-size"></div>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button type="button" class="choose-btn bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">Choose</button>
                <input type="file" id="docPan" class="sr-only" required>
              </div>
            </div>
          </div>
